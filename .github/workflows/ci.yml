name: Queue checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.13'
          extensions: json, mbstring, dom, xml, xmlwriter, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer test -- --colors=never
      - run: composer analyse
      - run: composer cs:check
      - run: php examples/basic.php

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: queue_test
          POSTGRES_PASSWORD: queue_test
          POSTGRES_DB: queue_conformance
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_test -d queue_conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QUEUE_TEST_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=queue_conformance;connect_timeout=5'
      QUEUE_TEST_USER: queue_test
      QUEUE_TEST_PASSWORD: queue_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.13'
          extensions: json, mbstring, dom, xml, xmlwriter, pdo_pgsql, pcntl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:postgres -- --colors=never
